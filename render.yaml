databases:
  - name: media-walkie-db
    databaseName: mediawalkie
    user: mediawalkie
    plan: free

services:
  - type: web
    name: media-walkie-signaling
    env: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: media-walkie-db
          property: connectionString
